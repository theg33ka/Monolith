- type: entity
  abstract: true
  id: BaseWeaponShipRepairLaser
  parent:
  - BallisticArtilleryTier3HP
  name: SRL-30 Mender Mk1 ship repair laser
  description: A fixed ship-mounted repair laser for reconstructing damaged tiles and repairable fixtures on another grid.
  components:
  - type: StaticPrice
    price: 24000
  - type: Sprite
    sprite: Forge/Objects/ShuttleWeapons/repair_laser.rsi
    scale: 0.5, 0.5
    layers:
    - state: space_artillery
  - type: Appearance
  - type: AmmoCounter
  - type: LimitedCharges
    maxCharges: 10000
    charges: 10000
  - type: ShipRepairLaser
    activeDuration: 2
    repairTimeMultiplier: 0.333
    powerUsePerSecond: 6000
  - type: FixedMountFireArc
    forwardOffset: 180
  - type: Battery
    maxCharge: 120000
    startingCharge: 120000
  - type: BatterySelfRecharger
    autoRechargePause: true
    autoRechargePauseTime: 30
    autoRecharge: true
    autoRechargeRate: 120000
  - type: ExaminableBattery
  - type: WirelessNetworkConnection
    range: 500
  - type: FireControllable
    fireCooldown: 1
  - type: Gun
    fireRate: 1
    recoil: 0
    minAngle: 0
    maxAngle: 0
    shootThermalSignature: 2500000
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/ship_perforator.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/EmptyAlarm/smg_empty_alarm.ogg
  - type: BasicEntityAmmoProvider
    proto: ShipRepairLaserBeam
  - type: SpaceArtillery
    powerChargeRate: 40000
    powerUsePassive: 500
    powerUseActive: 0
  - type: RadarBlip
    radarColor: "#46d6a0"
    scale: 2
    visibleFromOtherGrids: true
    gridConfig:
      color: "#46d6a0"
      shape: Square
      respectZoom: true
      rotate: true
      bounds: "-1,-1.5,1,1.5"
  - type: HitscanRadar
    radarColor: "#46d6a0"
    lineThickness: 2
    lifeTime: 1
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1,-1.5,1,1.5"
        density: 1500
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: ShipRepairable
    repairTime: 35
    repairCost: 150
  - type: Tag
    tags:
    - ShipRepairTool
    - ShipRepairLaserMatter

- type: entity
  abstract: true
  id: BaseWeaponShipRepairLaserMapped
  parent:
  - BallisticArtilleryMapped
  - BaseWeaponShipRepairLaser
  components:
  - type: ShipGunType
    shipType: Energy
  - type: ShipGunClass
    shipClass: Heavy

