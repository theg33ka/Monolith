- type: entity
  id: HMETacticalMedipenCase
  parent: [ BaseStorageItem, BaseBagOpenClose ]
  name: HME tactical medipen case
  description: A reinforced HME medipen case with additional field slots for compact injectors.
  components:
  - type: Sprite
    sprite: _Forge/Objects/Specific/Medical/HME/tactical_medipen_case.rsi
    layers:
    - state: closed
      map: [ "closeLayer" ]
    - state: open
      map: [ "openLayer" ]
      visible: false
  - type: Storage
    grid:
    - 0,0,4,1
    maxItemSize: Tiny
    quickInsert: true
    areaInsert: true
    whitelist:
      components:
      - Hypospray
  - type: Item
    sprite: _Forge/Objects/Specific/Medical/HME/tactical_medipen_case.rsi
    size: Small
    shape:
    - 0,0,1,1
  - type: Dumpable
  - type: PhysicalComposition
    materialComposition:
      Plastic: 90
      Steel: 60
      Durathread: 25
  - type: StaticPrice
    price: 450

- type: entity
  id: HMESmartInfusionStand
  parent: BaseStructureDynamic
  name: HME smart infusion stand
  description: A portable HME infusion stand that watches nearby downed patients and carefully meters needed medicine from installed small beakers.
  components:
  - type: Sprite
    drawdepth: SmallObjects
    sprite: _Forge/Objects/Specific/Medical/HME/smart_infusion_stand.rsi
    layers:
    - state: "off"
      map: [ "base" ]
    - state: beaker-1
      visible: false
      map: [ "beaker1" ]
    - state: beaker-2
      visible: false
      map: [ "beaker2" ]
    - state: beaker-3
      visible: false
      map: [ "beaker3" ]
  - type: Icon
    sprite: _Forge/Objects/Specific/Medical/HME/smart_infusion_stand.rsi
    state: "off"
  - type: GenericVisualizer
    visuals:
      enum.HmeInfusionStandVisuals.State:
        base:
          Empty: { state: "off" }
          Idle: { state: "off" }
          Filled: { state: "off" }
          Active: { state: active }
      enum.HmeInfusionStandVisuals.BeakerCount:
        beaker1:
          0: { visible: false }
          1: { visible: true }
          2: { visible: true }
          3: { visible: true }
        beaker2:
          0: { visible: false }
          1: { visible: false }
          2: { visible: true }
          3: { visible: true }
        beaker3:
          0: { visible: false }
          1: { visible: false }
          2: { visible: false }
          3: { visible: true }
  - type: Appearance
  - type: Storage
    grid:
    - 0,0,3,1
    maxItemSize: Normal
    quickInsert: true
    areaInsert: true
    whitelist:
      components:
      - FitsInDispenser
      tags:
      - Bottle
      - CentrifugeCompatible
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
  - type: Dumpable
  - type: HmeSmartInfusionStand
    transferAmount: 0.2
  - type: StaticPrice
    price: 1400

- type: entity
  id: ClothingEyesHudHMETriage
  parent: [ ClothingEyesBase, ShowMedicalIcons ]
  name: HME triage visor
  description: A lightweight HME visor that keeps normal medical HUD data and highlights the dominant injury type first.
  components:
  - type: Sprite
    sprite: _Forge/Clothing/Eyes/HME/triage_visor.rsi
  - type: Clothing
    sprite: _Forge/Clothing/Eyes/HME/triage_visor.rsi
  - type: HmeTriageVisor
  - type: Tag
    tags:
    - HudMedical
  - type: StaticPrice
    price: 600

- type: entity
  id: HMEStasisBlossomUnit
  parent: [ BaseItem, PowerCellSlotSmallItem ]
  name: HME stasis blossom unit
  description: A compact HME stabilizer that clips to a patient and unfolds into a reusable stasis field.
  components:
  - type: Sprite
    drawdepth: Effects
    noRot: true
    sprite: _Forge/Objects/Specific/Medical/HME/stasis_blossom_unit.rsi
    layers:
    - state: compact
      map: [ "base" ]
    - state: active-screen
      shader: unshaded
      visible: false
      map: [ "screen" ]
  - type: Icon
    sprite: _Forge/Objects/Specific/Medical/HME/stasis_blossom_unit.rsi
    state: compact
  - type: HmeStasisBlossomVisuals
  - type: Appearance
  - type: Item
    size: Small
    sprite: _Forge/Objects/Specific/Medical/HME/stasis_blossom_unit.rsi
  - type: Clothing
    sprite: _Forge/Objects/Specific/Medical/HME/stasis_blossom_unit.rsi
    quickEquip: false
    slots:
    - back
  - type: HmeStasisBlossom
  - type: ItemToggle
    onUse: false
  - type: UserInterface
    interfaces:
      enum.HealthAnalyzerUiKey.Key:
        type: HealthAnalyzerBoundUserInterface
  - type: PointLight
    enabled: false
    radius: 2.5
    energy: 1
    color: "#80DFFF"
  - type: StaticPrice
    price: 900

- type: entity
  id: ActionHMEStasisBlossomToggle
  name: Toggle HME stasis blossom
  description: Deploys or folds the attached HME stasis blossom.
  components:
  - type: InstantAction
    itemIconStyle: BigItem
    event: !type:HmeStasisBlossomToggleEvent

- type: entity
  id: HMEExperimentalRescueBeacon
  parent: ClothingArmbandBase
  name: HME experimental rescue beacon
  description: An HME armband beacon that attempts emergency extraction during expedition collapse.
  components:
  - type: Sprite
    sprite: _Forge/Objects/Specific/Medical/HME/rescue_beacon.rsi
    layers:
    - state: icon
      map: [ "beacon" ]
  - type: GenericVisualizer
    visuals:
      enum.HmeRescueBeaconVisuals.State:
        beacon:
          Idle: { state: icon, color: "#FFFFFF" }
          Armed: { state: icon, color: "#FFFFFF" }
          Spent: { state: icon, color: "#808080" }
  - type: Appearance
  - type: Clothing
    sprite: _Forge/Objects/Specific/Medical/HME/rescue_beacon.rsi
    clothingVisuals:
      leftarmband:
      - state: equipped-ARMBANDLEFT
      rightarmband:
      - state: equipped-ARMBANDRIGHT
      leftarmband-vox:
      - state: equipped-ARMBANDLEFT-vox
      rightarmband-vox:
      - state: equipped-ARMBANDRIGHT-vox
      leftarmband-hydrakin:
      - state: equipped-ARMBANDLEFT-hydrakin
      rightarmband-hydrakin:
      - state: equipped-ARMBANDRIGHT-hydrakin
  - type: Item
    sprite: _Forge/Objects/Specific/Medical/HME/rescue_beacon.rsi
  - type: HmeRescueBeacon
  - type: StaticPrice
    price: 2500
