- type: entity
  id: KiasRoomScanner
  parent: BaseKiasWallDevice
  name: KIAS modular room scanner
  components:
  - type: Machine
    board: KiasRoomScannerBoard
  - type: KiasDevice
    role: Scanner
  - type: KiasRoomScanner
  - type: DeviceLinkSource
    ports: [KiasMotion]
  - type: ItemSlots
    slots:
      kias-module-1:
        startingItem: KiasMotionModule
        whitelist:
          components: [KiasScannerModule]
      kias-module-2:
        startingItem: KiasTransponderModule
        whitelist:
          components: [KiasScannerModule]
      kias-module-3:
        whitelist:
          components: [KiasScannerModule]
      kias-module-4:
        whitelist:
          components: [KiasScannerModule]
      kias-module-5:
        whitelist:
          components: [KiasScannerModule]
      kias-module-6:
        whitelist:
          components: [KiasScannerModule]
  - type: ContainerContainer
    containers:
      kias-module-1: !type:ContainerSlot
      kias-module-2: !type:ContainerSlot
      kias-module-3: !type:ContainerSlot
      kias-module-4: !type:ContainerSlot
      kias-module-5: !type:ContainerSlot
      kias-module-6: !type:ContainerSlot

