- type: entity
  id: KiasDataCable
  name: KIAS data cable
  description: An underfloor automation bus with a two tile service radius.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
    noRot: true
  - type: Visibility
    layer: 1
  - type: Sprite
    sprite: Structures/Power/Cables/mv_cable.rsi
    state: mvcable_4
    color: Cyan
    drawdepth: ThinWire
  - type: Icon
    sprite: Structures/Power/Cables/mv_cable.rsi
    state: mvcable_4
  - type: SubFloorHide
  - type: Clickable
  - type: InteractionOutline
  - type: Cable
    cableType: Data
    cableDroppedOnCutPrototype: KiasDataCableStack1
  - type: KiasDataCable
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [Destruction]

- type: stack
  id: KiasDataCable
  name: KIAS data cable
  icon: { sprite: /Textures/Objects/Tools/cable-coils.rsi, state: coilmv-30 }
  spawn: KiasDataCableStack1
  maxCount: 100

- type: entity
  id: KiasDataCableStack
  parent: CableStack
  name: KIAS data cable coil
  components:
  - type: Stack
    stackType: KiasDataCable
    baseLayer: base
    layerStates: [coilmv-10, coilmv-20, coilmv-30]
  - type: Sprite
    color: Cyan
    layers:
    - state: coilmv-30
      map: [base]
  - type: Item
    heldPrefix: coilmv
  - type: CablePlacer
    cablePrototypeID: KiasDataCable
    blockingWireType: Data
  - type: Appearance

- type: entity
  id: KiasDataCableStack1
  parent: KiasDataCableStack
  suffix: 1
  components:
  - type: Stack
    count: 1

- type: entity
  id: BaseKiasServer
  parent: BaseMachinePowered
  abstract: true
  components:
  - type: Construction
    graph: Machine
    node: machine
    containers: [machine_board, machine_parts]
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: Sprite
    sprite: Structures/Machines/server.rsi
    layers:
    - state: server
    - state: variant-crew
      color: Cyan
  - type: ApcPowerReceiver
    powerLoad: 100
  - type: ExtensionCableReceiver
  - type: KiasDevice
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.KiasVisuals.Status:
        0:
          enum.KiasDeviceStatus.Online: { color: Cyan }
          enum.KiasDeviceStatus.Offline: { color: Gray }
          enum.KiasDeviceStatus.NoPower: { color: Gray }
          enum.KiasDeviceStatus.NoDataPath: { color: Orange }
          enum.KiasDeviceStatus.Disconnected: { color: Gray }
          enum.KiasDeviceStatus.DuplicateCore: { color: Red }

- type: entity
  id: BaseKiasWallDevice
  parent: BaseKiasServer
  abstract: true
  placement:
    mode: SnapgridCenter
    snap: [Wallmount]
  components:
  - type: WallMount
    arc: 175
  - type: Sprite
    drawdepth: WallMountedItems
    sprite: Structures/Wallmounts/air_monitors.rsi
    layers:
    - state: alarm0
  - type: Fixtures
    fixtures: {}

- type: entity
  id: KiasCore
  parent: BaseKiasServer
  name: KIAS core
  components:
  - type: Machine
    board: KiasCoreBoard
  - type: KiasCore
  - type: KiasProtocol
    protocols:
    - trigger: HullImpact
      actions:
      - kind: Lights
        group: EMERGENCY
        value: true
    - trigger: HullImpact
      actions:
      - kind: Pdc
        value: true
    - trigger: WeaponFlash
      disposition: Hostile
      actions:
      - kind: Lights
        group: EMERGENCY
        value: true
    - trigger: WeaponFlash
      disposition: Hostile
      actions:
      - kind: Pdc
        value: true
    - trigger: Manual
      actions:
      - kind: Lights
        group: EMERGENCY
        value: true
    - trigger: Manual
      actions:
      - kind: Pdc
        value: true
  - type: KiasDevice
    role: Core

