    board: KiasManagementConsoleBoard
  - type: KiasDevice
    role: Display
  - type: KiasDisplay
  - type: KiasManagement
  - type: KiasResourceMonitor
  - type: KiasClaimable
  - type: ActivatableUI
    key: enum.KiasUiKey.Key
  - type: UserInterface
    interfaces:
      enum.KiasUiKey.Key:
        type: KiasBoundUserInterface

