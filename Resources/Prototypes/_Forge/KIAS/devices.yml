- type: constructionGraph
  id: KiasEmergencyButtonGraph
  start: start
  graph:
  - node: start
    edges:
    - to: button
      steps:
      - material: Steel
        amount: 1
        doAfter: 2
      - material: Cable
        amount: 1
  - node: button
    entity: KiasEmergencyButton
    edges:
    - to: start
      steps:
      - tool: Screwing
        doAfter: 2
      completed:
      - !type:SpawnPrototype
        prototype: SheetSteel1
      - !type:SpawnPrototype
        prototype: CableApcStack1
      - !type:DeleteEntity {}

- type: construction
  id: KiasEmergencyButton
  name: kias-emergency-button-name
  description: kias-emergency-button-description
  graph: KiasEmergencyButtonGraph
  startNode: start
  targetNode: button
  category: construction-category-machines
  objectType: Structure
  icon: { sprite: Structures/Wallmounts/switch.rsi, state: on }
  canRotate: true
  canBuildInImpassable: true

